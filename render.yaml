services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: tinytales-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false          # set in Render dashboard → Environment
      - key: REDIS_URL
        sync: false          # Upstash Redis URL (rediss://...)
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://tinytales-world.vercel.app
      - key: STORAGE_PROVIDER
        value: local
      - key: LLM_PROVIDER
        value: mock
      - key: IMAGE_PROVIDER
        value: mock
      - key: VIDEO_PROVIDER
        value: mock
      - key: TTS_PROVIDER
        value: mock
      - key: MUSIC_PROVIDER
        value: mock
      - key: PYTHON_VERSION
        value: 3.12.0
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend (static) ────────────────────────────────────────────────────────
  - type: web
    name: tinytales-frontend
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        sync: false          # https://tinytales-api.onrender.com/api/v1
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
